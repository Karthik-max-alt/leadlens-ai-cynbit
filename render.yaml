services:
  - type: web
    name: leadlens-ai-cynbit
    runtime: python
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LEADLENS_DEMO_MODE
        value: "true"
      - key: LEADLENS_DB
        value: data/leadlens.db
      - key: OPENAI_MODEL
        value: gpt-4o-mini
